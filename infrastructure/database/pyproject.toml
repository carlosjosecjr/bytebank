[project]
name = "database"
version = "0.1.0"
description = "Bytebank Database Infrastructure (Pure asyncpg & SQLc style)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "user",
    "account",
    "transaction",
    "asyncpg>=0.29.0",
]

[tool.uv.sources]
user = { workspace = true }
account = { workspace = true }
transaction = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
