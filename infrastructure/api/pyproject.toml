[project]
name = "api"
version = "0.1.0"
description = "Bytebank API Infrastructure"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "user",
    "account",
    "transaction",
    "database",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic[email]>=2.0.0",
    "pydantic-settings>=2.0.0",
    "pyjwt>=2.8.0",
    "bcrypt>=4.0.0",
    "email-validator>=2.0.0",
    "python-multipart>=0.0.9",
]

[tool.uv.sources]
user = { workspace = true }
account = { workspace = true }
transaction = { workspace = true }
database = { workspace = true }

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
