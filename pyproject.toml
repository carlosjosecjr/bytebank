[project]
name = "bytebank"
version = "0.1.0"
description = "Bytebank API Monorepo"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "user",
    "account",
    "transaction",
    "database",
    "api",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "httpx>=0.27.0",
]

[project.scripts]
bytebank = "bytebank.main:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"

[tool.uv.workspace]
members = [
    "foundations/transaction",
    "foundations/user",
    "foundations/account",
    "infrastructure/database",
    "infrastructure/api",
]

[tool.uv.sources]
user = { workspace = true }
account = { workspace = true }
transaction = { workspace = true }
database = { workspace = true }
api = { workspace = true }

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["infrastructure/api/tests"]
